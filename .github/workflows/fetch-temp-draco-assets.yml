name: Fetch temporary Draco assets

on:
  push:
    paths:
      - '.github/workflows/fetch-temp-draco-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and encode files
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 https://raw.githubusercontent.com/google/draco/main/javascript/npm/draco3dgltf/draco_encoder_gltf_nodejs.js -o tmp_draco_encoder.js
          curl -L --fail --retry 3 https://raw.githubusercontent.com/google/draco/main/javascript/npm/draco3dgltf/draco_encoder.wasm -o tmp_draco_encoder.wasm
          base64 -w 76 tmp_draco_encoder.js > tmp_draco_encoder_js.b64.txt
          base64 -w 76 tmp_draco_encoder.wasm > tmp_draco_encoder_wasm.b64.txt
          rm tmp_draco_encoder.js tmp_draco_encoder.wasm
      - name: Commit temporary text assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_draco_encoder_js.b64.txt tmp_draco_encoder_wasm.b64.txt
          git commit -m "Add temporary Draco text assets [skip ci]"
          git push
